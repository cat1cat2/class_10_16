<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常計畫｜每日行程</title>
<style>
:root{--ink:#26332e;--muted:#89918b;--green:#658374;--dark:#405c4d;--light:#edf2ec;--paper:#fffefa;--canvas:#f7f6f2;--line:#eeeee7}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font:15px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif}.page{width:min(1120px,calc(100% - 48px));margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #e9e9e2}.brand{display:flex;align-items:center;gap:11px;font-weight:700}.brand-mark{display:grid;width:36px;height:36px;place-items:center;border-radius:12px;background:var(--green);color:white}.header-note,.section-caption{color:var(--muted);font-size:13px}main{padding:38px 0 60px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{margin:0;font-size:clamp(27px,4vw,36px);line-height:1.3}.date-box{text-align:right}.date-label{color:var(--muted);font-size:12px}.date-value{font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:20px;align-items:start}.left-column,.right-column{display:grid;gap:20px}.card{padding:24px;border:1px solid #efeee8;border-radius:18px;background:var(--paper);box-shadow:0 12px 36px #323f360f}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h2{margin:0;font-size:18px}.agenda-list{display:grid}.agenda-item{display:grid;grid-template-columns:60px 3px minmax(0,1fr) auto;align-items:center;gap:13px;min-height:74px;border-bottom:1px solid var(--line)}.agenda-item:last-child{border:0}.agenda-time{color:var(--dark);font-weight:700}.agenda-marker{width:3px;height:36px;border-radius:5px;background:#b7c8b9}.agenda-item:nth-child(2) .agenda-marker{background:#dfb99e}.agenda-item:nth-child(3) .agenda-marker{background:#c7bdd8}.agenda-title{font-weight:600}.agenda-location{color:var(--muted);font-size:12px}.tag{padding:4px 9px;border-radius:20px;background:var(--light);color:var(--dark);font-size:11px;white-space:nowrap}
.todo-list{display:grid}.todo-item{display:flex;align-items:center;gap:12px;min-height:48px}.todo-item input{accent-color:var(--green)}.todo-text{flex:1;font-size:14px}.todo-state{padding:3px 8px;border-radius:20px;background:#f3f0e8;color:#81785e;font-size:11px}.todo-item input:checked+.todo-text{color:#999;text-decoration:line-through}.todo-item input:checked~.todo-state{background:var(--light);color:var(--dark)}
.form-card{background:#fcfbf7}.form-intro{margin:5px 0 18px;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{color:#5e6861;font-size:12px;font-weight:600}input[type=text],input[type=time],textarea{width:100%;padding:10px 12px;border:1px solid #e7e6de;border-radius:10px;background:#fffefa;color:var(--ink);font:inherit;font-size:13px}textarea{min-height:70px;resize:vertical}.submit-button{width:100%;margin-top:15px;padding:11px;border:0;border-radius:10px;background:var(--green);color:white;font-weight:600;cursor:pointer}.submit-button:hover{background:var(--dark)}footer{padding:0 0 25px;color:#a1a49e;text-align:center;font-size:12px}
@media(max-width:760px){.page{width:min(calc(100% - 32px),560px)}.layout{grid-template-columns:1fr}main{padding-top:28px}}@media(max-width:420px){.card{padding:18px}.agenda-item{grid-template-columns:50px 3px 1fr;gap:10px}.agenda-item .tag{display:none}}
</style>
</head>
<body><div class="page">
<header><div class="brand"><span class="brand-mark" aria-hidden="true">日</span><span>日常計畫</span></div><div class="header-note">把日子過成喜歡的樣子</div></header>
<main>
<section class="intro" aria-labelledby="page-title"><div><p class="eyebrow">MY DAILY PLANNER</p><h1 id="page-title">今天的安排</h1></div><div class="date-box"><div class="date-label">今天是</div><div class="date-value" id="today-date">載入日期中…</div></div></section>
<div class="layout"><div class="left-column">
<section class="card" aria-labelledby="agenda-heading"><div class="section-heading"><h2 id="agenda-heading">今日行程</h2><span class="section-caption" id="agenda-count">共 3 個安排</span></div><div class="agenda-list" id="agenda-list" aria-live="polite">
<article class="agenda-item"><time class="agenda-time" datetime="09:00">09:00</time><span class="agenda-marker" aria-hidden="true"></span><div><div class="agenda-title">晨間咖啡與閱讀</div><div class="agenda-location">在家・留一點時間給自己</div></div><span class="tag">個人時間</span></article>
<article class="agenda-item"><time class="agenda-time" datetime="13:30">13:30</time><span class="agenda-marker" aria-hidden="true"></span><div><div class="agenda-title">專案進度討論</div><div class="agenda-location">線上會議・確認本週方向</div></div><span class="tag">工作</span></article>
<article class="agenda-item"><time class="agenda-time" datetime="18:00">18:00</time><span class="agenda-marker" aria-hidden="true"></span><div><div class="agenda-title">晚餐與朋友聚會</div><div class="agenda-location">小巷食堂・記得提前出門</div></div><span class="tag">生活</span></article>
</div></section>
<section class="card" aria-labelledby="todo-heading"><div class="section-heading"><h2 id="todo-heading">待辦清單</h2><span class="section-caption">完成後點選左側圓框</span></div><div class="todo-list">
<label class="todo-item"><input type="checkbox"><span class="todo-text">整理本週工作進度</span><span class="todo-state">待處理</span></label>
<label class="todo-item"><input type="checkbox" checked><span class="todo-text">回覆重要訊息</span><span class="todo-state">已完成</span></label>
<label class="todo-item"><input type="checkbox"><span class="todo-text">準備明天要用的資料</span><span class="todo-state">待處理</span></label>
</div></section>
</div><div class="right-column">
<section class="card form-card" aria-labelledby="form-heading"><div class="section-heading" style="margin-bottom:0"><h2 id="form-heading">新增行程</h2><span class="tag">快速記下</span></div><p class="form-intro">填寫行程內容，加入今天的安排。</p>
<form id="agenda-form"><div class="form-grid">
<div class="field full"><label for="event-title">行程名稱</label><input id="event-title" name="title" type="text" placeholder="例如：和朋友喝咖啡" required maxlength="60"></div>
<div class="field"><label for="event-time">開始時間</label><input id="event-time" name="time" type="time" required></div>
<div class="field"><label for="event-category">行程類型</label><input id="event-category" name="category" type="text" placeholder="例如：工作" maxlength="12"></div>
<div class="field full"><label for="event-location">地點或備註</label><textarea id="event-location" name="location" placeholder="加上一點行程細節（選填）" maxlength="120"></textarea></div>
</div><button class="submit-button" type="submit">＋ 加入行程</button></form></section>
</div></div></main><footer>一點一滴，都是好好生活的證明。</footer>
</div>
<script>
(() => {
const dateElement=document.getElementById('today-date');
dateElement.textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
const form=document.getElementById('agenda-form');const list=document.getElementById('agenda-list');const count=document.getElementById('agenda-count');
form.addEventListener('submit',(event)=>{
event.preventDefault();if(!form.reportValidity())return;
const data=new FormData(form);const title=String(data.get('title')).trim();const time=String(data.get('time'));
const category=String(data.get('category')).trim()||'其他';const location=String(data.get('location')).trim()||'尚未新增備註';if(!title||!time)return;
const item=document.createElement('article');item.className='agenda-item';
const timeElement=document.createElement('time');timeElement.className='agenda-time';timeElement.dateTime=time;timeElement.textContent=time;
const marker=document.createElement('span');marker.className='agenda-marker';marker.setAttribute('aria-hidden','true');
const details=document.createElement('div');const titleElement=document.createElement('div');titleElement.className='agenda-title';titleElement.textContent=title;
const locationElement=document.createElement('div');locationElement.className='agenda-location';locationElement.textContent=location;details.append(titleElement,locationElement);
const tag=document.createElement('span');tag.className='tag';tag.textContent=category;item.append(timeElement,marker,details,tag);
const next=Array.from(list.querySelectorAll('.agenda-item')).find((existing)=>existing.querySelector('time').dateTime>time);
if(next)list.insertBefore(item,next);else list.append(item);
count.textContent=`共 ${list.querySelectorAll('.agenda-item').length} 個安排`;form.reset();document.getElementById('event-title').focus();
});
document.querySelectorAll('.todo-item input').forEach((checkbox)=>checkbox.addEventListener('change',()=>{checkbox.closest('.todo-item').querySelector('.todo-state').textContent=checkbox.checked?'已完成':'待處理'}));
})();
</script>
</body>
</html>
